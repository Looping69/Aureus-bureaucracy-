name: Stability Verification

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    name: Lint, test, build, and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run lint

      - name: Unit and invariant tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke regression
        run: npm run smoke:regression
