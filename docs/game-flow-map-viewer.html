<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aureus Game Flow Map Viewer</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1020;
        --panel: rgba(8, 12, 24, 0.88);
        --panel-border: rgba(255, 255, 255, 0.14);
        --text: #e6edf7;
        --muted: #9fb0c9;
        --danger: #fda4af;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background:
          radial-gradient(circle at top left, rgba(56, 189, 248, 0.12), transparent 24%),
          radial-gradient(circle at bottom right, rgba(125, 211, 252, 0.08), transparent 30%),
          var(--bg);
        color: var(--text);
        font-family: "Segoe UI", system-ui, sans-serif;
      }

      .app {
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100%;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
        justify-content: space-between;
        padding: 0.9rem 1rem;
        border-bottom: 1px solid var(--panel-border);
        background: var(--panel);
        backdrop-filter: blur(12px);
      }

      .title-block {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
      }

      .title-block h1 {
        margin: 0;
        font-size: 1rem;
        line-height: 1.1;
        letter-spacing: 0.02em;
      }

      .title-block p {
        margin: 0;
        font-size: 0.8rem;
        color: var(--muted);
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
      }

      button {
        appearance: none;
        border: 1px solid var(--panel-border);
        background: rgba(255, 255, 255, 0.04);
        color: var(--text);
        padding: 0.6rem 0.8rem;
        border-radius: 0.8rem;
        cursor: pointer;
        font: inherit;
        font-size: 0.9rem;
        transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
      }

      button:hover {
        background: rgba(125, 211, 252, 0.1);
        border-color: rgba(125, 211, 252, 0.45);
      }

      button:active {
        transform: scale(0.98);
      }

      .status {
        min-width: 13rem;
        text-align: right;
        font-size: 0.82rem;
        color: var(--muted);
      }

      .viewer-shell {
        position: relative;
        overflow: hidden;
      }

      .viewer {
        position: absolute;
        inset: 0;
        overflow: hidden;
        cursor: grab;
      }

      .viewer.dragging {
        cursor: grabbing;
      }

      .viewer svg {
        width: 100%;
        height: 100%;
        display: block;
        user-select: none;
        -webkit-user-drag: none;
      }

      .help {
        position: absolute;
        left: 1rem;
        bottom: 1rem;
        max-width: min(28rem, calc(100% - 2rem));
        padding: 0.8rem 0.95rem;
        border: 1px solid var(--panel-border);
        border-radius: 1rem;
        background: var(--panel);
        backdrop-filter: blur(10px);
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.4;
      }

      .help strong { color: var(--text); }
      .error { color: var(--danger); }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="toolbar">
        <div class="title-block">
          <h1>Aureus Game Flow Map</h1>
          <p>Pan, zoom, reset, and inspect the full SVG without losing vector sharpness.</p>
        </div>
        <div class="controls">
          <button id="zoom-in" type="button">Zoom In</button>
          <button id="zoom-out" type="button">Zoom Out</button>
          <button id="fit" type="button">Fit</button>
          <button id="actual" type="button">Actual Size</button>
          <button id="reset" type="button">Reset View</button>
        </div>
        <div id="status" class="status">Loading SVG…</div>
      </div>

      <div class="viewer-shell">
        <div id="viewer" class="viewer" aria-label="Interactive SVG viewer">

yle="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Progression: permits, mines, objectives, known NPCs, endings</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-S3-764" data-look="classic" transform="translate(26132.67578125, 5235)"><rect class="basic label-container" style="" x="-130" y="-51" width="260" height="102"/><g class="label" style="" transform="translate(-100, -36)"><rect/><foreignObject width="200" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>Narrative: feedbacks, cooldowns, world effects, story flags</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-S5-766" data-look="classic" transform="translate(26442.67578125, 5235)"><rect class="basic label-container" style="" x="-130" y="-63" width="260" height="126"/><g class="label" style="" transform="translate(-100, -48)"><rect/><foreignObject width="200" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p>World: buildings, navigationZones, day, time, playerPos, targetPos, path, pickups</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs></svg>
        </div>
        <div class="help">
          <strong>Controls:</strong> drag to pan, use the mouse wheel or trackpad to zoom at the cursor, and use the toolbar if you want cleaner jumps.
        </div>
      </div>
    </div>

    <script>
      const viewer = document.getElementById("viewer");
      const statusEl = document.getElementById("status");

      const state = {
        svg: null,
        initialViewBox: null,
        currentViewBox: null,
        dragStart: null,
        maxZoomInFactor: 250,
        maxZoomOutFactor: 1.25,
      };

      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

      const formatZoom = () => {
        if (!state.initialViewBox || !state.currentViewBox) return "Zoom: --";
        const scale = state.initialViewBox.width / state.currentViewBox.width;
        return `Zoom: ${scale.toFixed(scale >= 10 ? 1 : 2)}x`;
      };

      const updateStatus = (extra = "") => {
        const base = state.currentViewBox ? formatZoom() : "Loading SVG…";
        statusEl.textContent = extra ? `${base} • ${extra}` : base;
      };

      const applyViewBox = () => {
        if (!state.svg || !state.currentViewBox) return;
        const vb = state.currentViewBox;
        state.svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.width} ${vb.height}`);
        updateStatus();
      };

      const setCurrentViewBox = (nextViewBox) => {
        const initial = state.initialViewBox;
        const minWidth = initial.width / state.maxZoomInFactor;
        const maxWidth = initial.width * state.maxZoomOutFactor;
        const aspect = initial.width / initial.height;

        const width = clamp(nextViewBox.width, minWidth, maxWidth);
        const height = width / aspect;

        state.currentViewBox = {
          x: nextViewBox.x,
          y: nextViewBox.y,
          width,
          height,
        };

        applyViewBox();
      };

      const resetView = () => {
        state.currentViewBox = { ...state.initialViewBox };
        applyViewBox();
      };

      const fitView = () => {
        resetView();
      };

      const actualSize = () => {
        const initial = state.initialViewBox;
        const width = initial.width / 2;
        const height = initial.height / 2;
        const x = initial.x + (initial.width - width) / 2;
        const y = initial.y + (initial.height - height) / 2;
        setCurrentViewBox({ x, y, width, height });
      };

      const zoomAtPoint = (clientX, clientY, zoomFactor) => {
        const rect = viewer.getBoundingClientRect();
        const vb = state.currentViewBox;
        const px = (clientX - rect.left) / rect.width;
        const py = (clientY - rect.top) / rect.height;

        const anchorX = vb.x + vb.width * px;
        const anchorY = vb.y + vb.height * py;
        const nextWidth = vb.width * zoomFactor;
        const nextHeight = vb.height * zoomFactor;

        setCurrentViewBox({
          x: anchorX - nextWidth * px,
          y: anchorY - nextHeight * py,
          width: nextWidth,
          height: nextHeight,
        });
      };

      const panByPixels = (dx, dy) => {
        const rect = viewer.getBoundingClientRect();
        const vb = state.currentViewBox;
        const unitsPerPixelX = vb.width / rect.width;
        const unitsPerPixelY = vb.height / rect.height;

        state.currentViewBox = {
          ...vb,
          x: vb.x - dx * unitsPerPixelX,
          y: vb.y - dy * unitsPerPixelY,
        };

        applyViewBox();
      };

      const bindInteractions = () => {
        viewer.addEventListener("wheel", (event) => {
          event.preventDefault();
          const zoomFactor = event.deltaY < 0 ? 0.88 : 1.14;
          zoomAtPoint(event.clientX, event.clientY, zoomFactor);
        }, { passive: false });

        viewer.addEventListener("pointerdown", (event) => {
          state.dragStart = { x: event.clientX, y: event.clientY };
          viewer.classList.add("dragging");
          viewer.setPointerCapture(event.pointerId);
        });

        viewer.addEventListener("pointermove", (event) => {
          if (!state.dragStart) return;
          const dx = event.clientX - state.dragStart.x;
          const dy = event.clientY - state.dragStart.y;
          state.dragStart = { x: event.clientX, y: event.clientY };
          panByPixels(dx, dy);
        });

        const endDrag = (event) => {
          if (!state.dragStart) return;
          state.dragStart = null;
          viewer.classList.remove("dragging");
          if (viewer.hasPointerCapture(event.pointerId)) {
            viewer.releasePointerCapture(event.pointerId);
          }
        };

        viewer.addEventListener("pointerup", endDrag);
        viewer.addEventListener("pointercancel", endDrag);

        window.addEventListener("keydown", (event) => {
          if (!state.currentViewBox) return;
          if (event.key === "+" || event.key === "=") {
            zoomAtPoint(window.innerWidth / 2, window.innerHeight / 2, 0.88);
          } else if (event.key === "-" || event.key === "_") {
            zoomAtPoint(window.innerWidth / 2, window.innerHeight / 2, 1.14);
          } else if (event.key.toLowerCase() === "0") {
            resetView();
          }
        });

        document.getElementById("zoom-in").addEventListener("click", () => {
          const rect = viewer.getBoundingClientRect();
          zoomAtPoint(rect.left + rect.width / 2, rect.top + rect.height / 2, 0.8);
        });
        document.getElementById("zoom-out").addEventListener("click", () => {
          const rect = viewer.getBoundingClientRect();
          zoomAtPoint(rect.left + rect.width / 2, rect.top + rect.height / 2, 1.25);
        });
        document.getElementById("fit").addEventListener("click", fitView);
        document.getElementById("actual").addEventListener("click", actualSize);
        document.getElementById("reset").addEventListener("click", resetView);
      };

      const ensureViewBox = (svg) => {
        if (svg.hasAttribute("viewBox")) {
          const box = svg.viewBox.baseVal;
          return { x: box.x, y: box.y, width: box.width, height: box.height };
        }

        const width = Number(svg.getAttribute("width")) || 1000;
        const height = Number(svg.getAttribute("height")) || 1000;
        svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
        return { x: 0, y: 0, width, height };
      };

      const initializeViewer = () => {
        try {
          const svg = viewer.querySelector("svg");
          if (!svg) {
            throw new Error("No inline SVG found in viewer.");
          }

          state.svg = svg;
          state.initialViewBox = ensureViewBox(svg);
          state.currentViewBox = { ...state.initialViewBox };
          applyViewBox();
          bindInteractions();
          updateStatus("Drag to pan");
        } catch (error) {
          statusEl.innerHTML = `<span class="error">Failed to initialize viewer: ${error.message}</span>`;
          viewer.innerHTML = "";
        }
      };

      initializeViewer();
    </script>
